<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#04040c">
<title>Liquid Light</title>
<script data-goatcounter="https://georgestriderbuilds.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  :root{
    --violet:#8a5cff; --uv:#b45cff; --cyan:#37e0ff; --jade:#3dff9e; --ember:#ff9a3f;
    --ink:#e8ecf4; --dim:#8b93a7; --line:#1c2333;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#04040c;color:var(--ink);
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    height:100dvh;overflow:hidden;display:flex;flex-direction:column;
    padding:10px 14px;padding-bottom:34px;padding-bottom:max(34px, calc(10px + env(safe-area-inset-bottom)));
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    background-image:radial-gradient(120% 60% at 50% -10%, rgba(138,92,255,.13), transparent 60%),
                     radial-gradient(100% 50% at 50% 115%, rgba(55,224,255,.09), transparent 60%);
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 8px}
  .title{font-size:13px;letter-spacing:.28em;white-space:nowrap}
  .title b{color:var(--uv);font-weight:700}
  .title span{color:var(--cyan)}
  .live{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.18em;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 2.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .chips{display:flex;gap:6px}
  .chip{font:inherit;font-size:9px;letter-spacing:.14em;padding:5px 8px;border-radius:20px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--dim);cursor:pointer}
  .chip.on{color:#04040c;font-weight:700}
  .chip[data-pal="uv"].on{background:linear-gradient(90deg,var(--uv),var(--cyan));border-color:transparent}
  .chip[data-pal="jade"].on{background:linear-gradient(90deg,#0fdc84,var(--cyan));border-color:transparent}
  .chip[data-pal="ember"].on{background:linear-gradient(90deg,var(--ember),#ff4f6d);border-color:transparent}
  #dishWrap{position:relative;margin:0 auto;width:min(94vw,46dvh);aspect-ratio:1/1;flex:none}
  #dish{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;display:block}
  #rim{position:absolute;inset:-9px;border-radius:50%;pointer-events:none;
    border:1px solid #2a2350;
    box-shadow:0 0 0 4px rgba(8,6,20,.92), 0 0 34px rgba(138,92,255,.22), 0 0 60px rgba(55,224,255,.12), inset 0 0 22px rgba(0,0,0,.85)}
  #ticks{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);pointer-events:none;transform:translate(-9px,-9px)}
  #readout{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:10px 2px 2px}
  #freqBig{font-size:34px;line-height:1;font-weight:700}
  #freqBig small{font-size:13px;color:var(--dim);letter-spacing:.1em}
  #modeName{font-size:10px;letter-spacing:.2em;color:var(--cyan);text-align:right}
  #modeName b{color:var(--uv)}
  #resBarWrap{height:5px;border-radius:3px;background:#141126;margin:7px 2px 0;overflow:hidden}
  #resBar{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 10px rgba(55,224,255,.7);transition:width .12s}
  #resLabel{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.18em;color:var(--dim);padding:4px 2px 0}
  #dialZone{display:flex;align-items:center;gap:12px;padding:8px 2px 0}
  #dial{position:relative;width:118px;height:118px;flex:none;border-radius:50%;cursor:grab;touch-action:none;
    background:radial-gradient(circle at 50% 42%, #171233 0 58%, #08061a 59% 100%);
    border:1px solid #322a5e;box-shadow:0 0 26px rgba(138,92,255,.28), inset 0 0 18px rgba(0,0,0,.75)}
  #dial:active{cursor:grabbing}
  #dialRing{position:absolute;inset:5px;border-radius:50%;pointer-events:none;
    background:conic-gradient(from -90deg, var(--uv), var(--violet), var(--cyan), rgba(255,255,255,.06) 78%, rgba(255,255,255,.06));
    -webkit-mask:radial-gradient(circle, transparent 62%, #000 63%, #000 78%, transparent 79%);
            mask:radial-gradient(circle, transparent 62%, #000 63%, #000 78%, transparent 79%);opacity:.9}
  #needle{position:absolute;left:50%;top:50%;width:2px;height:44px;background:linear-gradient(var(--uv),transparent);
    transform-origin:50% 0;box-shadow:0 0 8px var(--uv);pointer-events:none}
  #dialHz{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  #dialHz b{font-size:19px}
  #dialHz span{font-size:8px;letter-spacing:.24em;color:var(--dim)}
  #sliders{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
  .srow label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.2em;color:var(--dim);margin-bottom:5px}
  .srow label output{color:var(--ink)}
  input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:4px;border-radius:2px;background:#1d1838;outline:none}
  input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:#08061a;border:2px solid var(--cyan);box-shadow:0 0 10px rgba(55,224,255,.8);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#08061a;border:2px solid var(--cyan);box-shadow:0 0 10px rgba(55,224,255,.8);cursor:pointer}
  #controls{display:flex;gap:8px;padding:12px 2px 0;margin-top:auto}
  .btn{flex:1;font:inherit;font-size:10px;letter-spacing:.16em;padding:12px 4px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;text-align:center}
  .btn.on{border-color:var(--uv);color:var(--uv);box-shadow:0 0 14px rgba(180,92,255,.25) inset}
  .btn:active{transform:scale(.97)}
</style>
</head>
<body>
<header>
  <div class="title"><b>LIQUID</b> <span>LIGHT</span></div>
  <div class="live"><span class="dot"></span>LIVE</div>
  <div class="chips">
    <button class="chip on" data-pal="uv">UV</button>
    <button class="chip" data-pal="jade">JADE</button>
    <button class="chip" data-pal="ember">EMBER</button>
  </div>
</header>

<div id="dishWrap">
  <canvas id="dish"></canvas>
  <div id="rim"></div>
  <svg id="ticks" viewBox="0 0 100 100"></svg>
</div>

<div id="readout">
  <div id="freqBig">164<small> Hz</small></div>
  <div id="modeName">MODE <b>HEX · 6FOLD</b></div>
</div>
<div id="resBarWrap"><div id="resBar"></div></div>
<div id="resLabel"><span>RESONANCE</span><span id="resPct">0%</span></div>

<div id="dialZone">
  <div id="dial">
    <div id="dialRing"></div>
    <div id="needle"></div>
    <div id="dialHz"><b id="dialHzVal">164</b><span>FREQ · Hz</span></div>
  </div>
  <div id="sliders">
    <div class="srow">
      <label>FINE TUNE <output id="fineOut">+0.0%</output></label>
      <input type="range" id="fine" min="-100" max="100" value="0" step="0.5">
    </div>
    <div class="srow">
      <label>AMPLITUDE <output id="ampOut">72%</output></label>
      <input type="range" id="amp" min="0" max="100" value="72" step="1">
    </div>
    <div class="srow">
      <label>DROPLETS <output id="dropOut">MED</output></label>
      <input type="range" id="drops" min="0" max="3" value="2" step="1">
    </div>
  </div>
</div>

<div id="controls">
  <button class="btn" id="soundBtn">SOUND OFF</button>
  <button class="btn" id="stirBtn">STIR</button>
  <button class="btn" id="calmBtn">CALM</button>
</div>

<script>
'use strict';
/* ================= Liquid Light =================
   Cymatics in liquid. The same true circular-plate mode
   field as a Chladni plate, rendered as a glowing liquid
   surface: wave phase picks the hue, wave energy picks
   the brightness, and droplets bounce on the antinodes
   the way they do on a real Faraday-wave dish.          */

/* ---------- Mode ladder (shared physics) ---------- */
const FOLD_NAMES = {0:'RINGS',1:'AXIS',2:'DUAL',3:'TRI',4:'QUAD',5:'PENTA',6:'HEX',7:'HEPTA',8:'OCTA'};
const MODES = [];
(function buildModes(){
  const raw = [];
  for (let L = 0; L <= 8; L++){
    for (let K = 1; K <= 3; K++){
      if (L === 0 && K === 1) continue;
      if (L === 1 && K === 1) continue;
      raw.push({L, K, s: K*K + L*L*0.82});
    }
  }
  raw.sort((a,b)=>a.s-b.s);
  const FMIN = 55, FMAX = 880, n = raw.length;
  raw.forEach((m,i)=>{
    m.freq = FMIN * Math.pow(FMAX/FMIN, i/(n-1));
    m.name = FOLD_NAMES[m.L] + ' · ' + (m.L===0 ? m.K+'RING' : m.L+'FOLD');
    MODES.push(m);
  });
})();
function fieldAt(mode, x, y){
  const r = Math.hypot(x, y);
  if (r > 1.02) return 0;
  const th = Math.atan2(y, x);
  const ang = mode.L === 0 ? 1 : Math.cos(mode.L * th);
  return ang * Math.sin(mode.K * Math.PI * Math.min(r, 1));
}
function modeBlend(freq){
  let i = 0;
  while (i < MODES.length-1 && MODES[i+1].freq < freq) i++;
  const a = MODES[i], b = MODES[Math.min(i+1, MODES.length-1)];
  if (a === b) return {a, b, wb: 0, prox: 1};
  const la = Math.log(a.freq), lb = Math.log(b.freq), lf = Math.log(freq);
  const t = Math.min(1, Math.max(0, (lf-la)/(lb-la)));
  return {a, b, wb: t, prox: 1 - Math.min(t, 1-t)*2};
}

/* ---------- Palettes: [phase+ rgb, phase- rgb] ramps ---------- */
const PALS = {
  uv:    { pos: [180, 92, 255], neg: [55, 224, 255], base: [6, 6, 20] },
  jade:  { pos: [61, 255, 158], neg: [55, 224, 255], base: [4, 12, 12] },
  ember: { pos: [255, 154, 63], neg: [255, 79, 109], base: [14, 6, 6] }
};
let palette = 'uv';
try{ const p = localStorage.getItem('llight.pal'); if (p && PALS[p]) palette = p; }catch(e){}

/* ---------- State ---------- */
let freq = 164, amp = 0.72, fine = 0, soundOn = false;
let stirKick = 0;

/* ---------- Canvases ---------- */
const wrap = document.getElementById('dishWrap');
const cv = document.getElementById('dish');
const ctx = cv.getContext('2d');
const GRID = 148;
const off = document.createElement('canvas'); off.width = off.height = GRID;
const offCtx = off.getContext('2d');
const img = offCtx.createImageData(GRID, GRID);
let W = 0, CX = 0, R = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const rect = wrap.getBoundingClientRect();
  W = Math.round(rect.width);
  cv.width = W * DPR; cv.height = W * DPR;
  CX = cv.width/2; R = cv.width * 0.485;
}
window.addEventListener('resize', resize);

/* swirl streak sprite (light trails around the dish) */
function makeSwirl(){
  const s = document.createElement('canvas'); s.width = s.height = 256;
  const c = s.getContext('2d');
  c.translate(128,128);
  for (let i = 0; i < 26; i++){
    const a0 = Math.random()*Math.PI*2, len = 0.5 + Math.random()*1.1, rad = 74 + Math.random()*46;
    c.beginPath();
    c.arc(0, 0, rad, a0, a0 + len);
    const hue = 258 + Math.random()*70;
    c.strokeStyle = 'hsla(' + hue + ',100%,70%,' + (0.05 + Math.random()*0.10) + ')';
    c.lineWidth = 1 + Math.random()*2.2;
    c.stroke();
  }
  return s;
}
const swirlA = makeSwirl(), swirlB = makeSwirl();

/* droplet sprite */
function makeDrop(){
  const s = document.createElement('canvas'); s.width = s.height = 32;
  const c = s.getContext('2d');
  const g = c.createRadialGradient(12,11,1,16,16,15);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.35, 'rgba(160,230,255,0.55)');
  g.addColorStop(0.8, 'rgba(90,140,255,0.16)');
  g.addColorStop(1, 'rgba(90,140,255,0)');
  c.fillStyle = g; c.beginPath(); c.arc(16,16,15,0,Math.PI*2); c.fill();
  return s;
}
const dropSprite = makeDrop();

/* ---------- Droplets ---------- */
const DROP_COUNTS = {0: 0, 1: 40, 2: 85, 3: 140};
let dropLevel = 2;
let drops = [];
function seedDrops(){
  drops = [];
  const n = DROP_COUNTS[dropLevel];
  for (let i = 0; i < n; i++){
    const r = Math.sqrt(Math.random())*0.9, th = Math.random()*Math.PI*2;
    drops.push({x: Math.cos(th)*r, y: Math.sin(th)*r, z: 0, vz: 0, s: 0.5 + Math.random()*0.9});
  }
}

/* ---------- Field render ---------- */
let tNow = 0;
function renderField(dt){
  tNow += dt;
  const blend = modeBlend(freq);
  const {a, b, wb, prox} = blend;
  const pal = PALS[palette];
  const contrast = 0.45 + prox * 0.95;                    // figures melt off resonance
  const shimmer = 0.86 + 0.14 * Math.sin(tNow * 2.6);
  const melt = (1 - prox) * 0.35;                          // coordinate swirl when off resonance
  const meltAng = Math.sin(tNow * 0.6) * melt;
  const cosM = Math.cos(meltAng), sinM = Math.sin(meltAng);
  const d = img.data;
  let idx = 0;
  for (let gy = 0; gy < GRID; gy++){
    const y0 = (gy / (GRID-1)) * 2 - 1;
    for (let gx = 0; gx < GRID; gx++, idx += 4){
      const x0 = (gx / (GRID-1)) * 2 - 1;
      const r2 = x0*x0 + y0*y0;
      if (r2 > 1){ d[idx+3] = 0; continue; }
      const x = x0*cosM - y0*sinM, y = x0*sinM + y0*cosM;
      let f = fieldAt(a, x, y);
      if (wb > 0) f = f*(1-wb) + fieldAt(b, x, y)*wb;
      f *= contrast * shimmer;
      const e = Math.min(1, Math.abs(f));
      const col = f >= 0 ? pal.pos : pal.neg;
      const glow = Math.pow(e, 1.6);
      let rr = pal.base[0] + col[0] * glow;
      let gg = pal.base[1] + col[1] * glow;
      let bb = pal.base[2] + col[2] * glow;
      if (e > 0.82){ const w = (e - 0.82) * 3.2; rr += (255-rr)*Math.min(1,w)*0.7; gg += (255-gg)*Math.min(1,w)*0.7; bb += (255-bb)*Math.min(1,w)*0.7; }
      // soft rim darkening inside the dish
      const rim = 1 - Math.pow(Math.max(0, (Math.sqrt(r2) - 0.86) / 0.14), 2) * 0.55;
      d[idx]   = rr * rim;
      d[idx+1] = gg * rim;
      d[idx+2] = bb * rim;
      d[idx+3] = 255;
    }
  }
  offCtx.putImageData(img, 0, 0);

  /* compose dish */
  ctx.clearRect(0, 0, cv.width, cv.height);
  // swirls behind dish
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(CX, CX);
  ctx.rotate(tNow * 0.05);
  ctx.globalAlpha = 0.8;
  ctx.drawImage(swirlA, -R*1.28, -R*1.28, R*2.56, R*2.56);
  ctx.rotate(-tNow * 0.09);
  ctx.globalAlpha = 0.55;
  ctx.drawImage(swirlB, -R*1.22, -R*1.22, R*2.44, R*2.44);
  ctx.restore();

  ctx.save();
  ctx.beginPath(); ctx.arc(CX, CX, R, 0, Math.PI*2); ctx.clip();
  ctx.imageSmoothingEnabled = true;
  // bloom pass
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.5;
  ctx.drawImage(off, CX - R*1.05, CX - R*1.05, R*2.1, R*2.1);
  ctx.globalAlpha = 1;
  ctx.drawImage(off, CX - R, CX - R, R*2, R*2);
  ctx.globalCompositeOperation = 'source-over';
  // gloss crescent
  const gloss = ctx.createRadialGradient(CX - R*0.42, CX - R*0.5, R*0.1, CX - R*0.3, CX - R*0.35, R*1.15);
  gloss.addColorStop(0, 'rgba(255,255,255,0.13)');
  gloss.addColorStop(0.5, 'rgba(255,255,255,0.02)');
  gloss.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gloss; ctx.fillRect(CX - R, CX - R, R*2, R*2);
  ctx.restore();

  /* droplets */
  stirKick *= 0.94;
  const excite = amp * (0.5 + prox) + stirKick;
  ctx.save();
  ctx.beginPath(); ctx.arc(CX, CX, R, 0, Math.PI*2); ctx.clip();
  for (const dr of drops){
    let f = fieldAt(a, dr.x, dr.y);
    if (wb > 0) f = f*(1-wb) + fieldAt(b, dr.x, dr.y)*wb;
    const e = Math.abs(f);
    if (dr.z <= 0 && e > 0.5 && Math.random() < e * excite * 0.24){
      dr.vz = 0.9 + e * excite * 2.4 * Math.random();
    }
    if (dr.z > 0 || dr.vz > 0){
      dr.vz -= 6.5 * dt;
      dr.z += dr.vz * dt;
      if (dr.z < 0){ dr.z = 0; dr.vz = 0; }
    }
    // slow drift across the surface
    dr.x += Math.sin(tNow * 0.4 + dr.y * 5) * 0.0006;
    dr.y += Math.cos(tNow * 0.33 + dr.x * 5) * 0.0006;
    const rr = Math.hypot(dr.x, dr.y);
    if (rr > 0.96){ const s = 0.96/rr; dr.x *= s; dr.y *= s; }
    const px = CX + dr.x * R, py = CX + dr.y * R - dr.z * R * 0.16;
    const sz = (7 + dr.s * 9) * DPR * (1 + dr.z * 0.25);
    // shadow on the surface
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(CX + dr.x*R, CX + dr.y*R + 3*DPR, sz*0.32, sz*0.14, 0, 0, Math.PI*2); ctx.fill();
    ctx.drawImage(dropSprite, px - sz/2, py - sz/2, sz, sz);
  }
  ctx.restore();
  return blend;
}

/* ---------- HUD ---------- */
const freqBig = document.getElementById('freqBig');
const modeName = document.getElementById('modeName');
const resBar = document.getElementById('resBar');
const resPct = document.getElementById('resPct');
const dialHzVal = document.getElementById('dialHzVal');
const needle = document.getElementById('needle');
const FMIN = 55, FMAX = 880;
function renderHUD(blend){
  const f = Math.round(freq);
  freqBig.innerHTML = f + '<small> Hz</small>';
  dialHzVal.textContent = f;
  const near = blend.wb < 0.5 ? blend.a : blend.b;
  modeName.innerHTML = 'MODE <b>' + near.name + '</b>';
  const pct = Math.round(blend.prox * 100);
  resBar.style.width = pct + '%';
  resPct.textContent = pct + '%';
  needle.style.transform = 'rotate(' + (((Math.log(freq) - Math.log(FMIN)) / (Math.log(FMAX) - Math.log(FMIN))) * 300 - 150) + 'deg) translateX(-50%)';
}

/* ---------- Audio ---------- */
let AC = null, osc1 = null, osc2 = null, gainNode = null;
function ensureAudio(){
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  osc1 = AC.createOscillator(); osc1.type = 'sine';
  osc2 = AC.createOscillator(); osc2.type = 'triangle';
  const g2 = AC.createGain(); g2.gain.value = 0.16;
  gainNode = AC.createGain(); gainNode.gain.value = 0;
  osc1.connect(gainNode); osc2.connect(g2); g2.connect(gainNode);
  gainNode.connect(AC.destination);
  osc1.start(); osc2.start();
}
function audioTick(){
  if (!AC) return;
  gainNode.gain.setTargetAtTime(soundOn ? amp * 0.32 : 0, AC.currentTime, 0.08);
  osc1.frequency.setTargetAtTime(freq, AC.currentTime, 0.03);
  osc2.frequency.setTargetAtTime(freq * 2.005, AC.currentTime, 0.03);
}

/* ---------- Controls ---------- */
const dial = document.getElementById('dial');
let dialDrag = null;
function setFreq(f){ freq = Math.min(FMAX, Math.max(FMIN, f)); }
dial.addEventListener('pointerdown', e=>{
  const r = dial.getBoundingClientRect();
  dialDrag = {ang: Math.atan2(e.clientY - (r.top + r.height/2), e.clientX - (r.left + r.width/2))};
  dial.setPointerCapture(e.pointerId);
});
dial.addEventListener('pointermove', e=>{
  if (!dialDrag) return;
  const r = dial.getBoundingClientRect();
  const ang = Math.atan2(e.clientY - (r.top + r.height/2), e.clientX - (r.left + r.width/2));
  let d = ang - dialDrag.ang;
  if (d > Math.PI) d -= Math.PI*2;
  if (d < -Math.PI) d += Math.PI*2;
  dialDrag.ang = ang;
  setFreq(freq * Math.exp(d * 1.15));
});
dial.addEventListener('pointerup', ()=>{ dialDrag = null; });
dial.addEventListener('wheel', e=>{ e.preventDefault(); setFreq(freq * Math.exp(-e.deltaY * 0.0012)); }, {passive:false});

document.getElementById('fine').addEventListener('input', e=>{
  fine = parseFloat(e.target.value);
  document.getElementById('fineOut').textContent = (fine>=0?'+':'') + fine.toFixed(1) + '%';
});
document.getElementById('amp').addEventListener('input', e=>{
  amp = parseInt(e.target.value, 10) / 100;
  document.getElementById('ampOut').textContent = e.target.value + '%';
});
document.getElementById('drops').addEventListener('input', e=>{
  dropLevel = parseInt(e.target.value, 10);
  document.getElementById('dropOut').textContent = ['OFF','LOW','MED','HIGH'][dropLevel];
  seedDrops();
});
document.querySelectorAll('.chip').forEach(ch=>{
  ch.classList.toggle('on', ch.dataset.pal === palette);
  ch.addEventListener('click', ()=>{
    palette = ch.dataset.pal;
    try{ localStorage.setItem('llight.pal', palette); }catch(e){}
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
    ch.classList.add('on');
  });
});
document.getElementById('soundBtn').addEventListener('click', function(){
  ensureAudio();
  if (AC.state === 'suspended') AC.resume();
  soundOn = !soundOn;
  this.textContent = soundOn ? 'SOUND ON' : 'SOUND OFF';
  this.classList.toggle('on', soundOn);
});
document.getElementById('stirBtn').addEventListener('click', ()=>{ stirKick = 1.6; });
document.getElementById('calmBtn').addEventListener('click', ()=>{ stirKick = 0; for (const d of drops){ d.z = 0; d.vz = 0; } });

(function ticks(){
  const svg = document.getElementById('ticks');
  let s = '';
  for (let i = 0; i < 72; i++){
    const a = i/72 * Math.PI*2, big = i % 6 === 0;
    const r1 = big ? 46.5 : 48, r2 = 49.6;
    s += '<line x1="' + (50 + Math.cos(a)*r1) + '" y1="' + (50 + Math.sin(a)*r1) +
         '" x2="' + (50 + Math.cos(a)*r2) + '" y2="' + (50 + Math.sin(a)*r2) +
         '" stroke="' + (big ? '#37e0ff' : '#322a5e') + '" stroke-width="' + (big ? 0.5 : 0.3) + '"/>';
  }
  svg.innerHTML = s;
})();

/* ---------- Main loop ---------- */
resize();
seedDrops();
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const save = freq;
  freq = freq * (1 + fine/100 * 0.06);
  const blend = renderField(dt);
  freq = save;
  renderHUD(blend);
  audioTick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
